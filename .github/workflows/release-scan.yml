name: Release scan

# The binaries of the latest release are reused by later releases as long as
# the Go code does not change (#126), so they age while main moves on. This
# job downloads the published release, checks its binaries against the hashes
# recorded in release-hashes.txt and scans them with govulncheck. A failure
# means the published binaries no longer match the record or contain a known
# vulnerability, and a new release is due.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/scan-release.sh
